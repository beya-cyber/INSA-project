services:
  frontend:
    build:
      context: ./ndsir-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build:
      context: ./ndsir-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ndsir_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: ./ndsir-backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ndsir_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ndsir_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
